<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalhes do produto | Pasticcio</title>
    <link rel="stylesheet" href="CSS/single.css">
    <script src="single-products.js" defer></script>
    <script src="single.js" defer></script>
</head>
<body class="single-product-page">
    <main class="single-carbonara" aria-labelledby="product-title">
        <a class="single-carbonara__close" href="index.html" aria-label="Voltar ao cardápio">×</a>
        <div class="single-carbonara__layout">
            <div class="single-carbonara__media" data-product-media hidden>
                <div class="single-carbonara__photo" data-product-photo>
                    <img alt="">
                </div>
                <div class="single-carbonara__ingredients">
                    <h2>Detalhes:</h2>
                    <div data-product-details></div>
                </div>
            </div>
            <div class="single-carbonara__content">
                <h1 id="product-title">Produto indisponível</h1>
                <div data-product-content hidden>
                    <p class="single-carbonara__price"></p>
                    <div class="single-carbonara__actions">
                        <div class="single-carbonara__counter" role="group" aria-label="Quantidade">
                            <button type="button" data-quantity-minus aria-label="Diminuir quantidade">−</button>
                            <output data-quantity-value aria-live="polite">0</output>
                            <button type="button" data-quantity-plus aria-label="Aumentar quantidade">+</button>
                        </div>
                        <button class="single-carbonara__add" type="button" data-add-to-cart>Adicionar ao carrinho</button>
                    </div>
                    <div class="single-carbonara__description"></div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
